name: Build PojavGuard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PojavGuard-Android-APK-Build-1-Hour-Shizuku.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project source
        run: unzip -q PojavGuard-Android-APK-Build-1-Hour-Shizuku.zip

      - name: Inspect scanner screen source
        run: |
          sed -n '1,320p' PojavGuard-Standalone/android/app/src/main/java/dev/pojavguard/standalone/MainActivity.kt

      - name: Patch compile blockers safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PojavGuard-Standalone/android/app/src/main/java/dev/pojavguard/standalone/MainActivity.kt")
          s = p.read_text()
          replacements = {
              "loadInventory(prefs)": "loadInventory(context)",
              "loadAlerts(prefs)": "loadAlerts(context)",
              "loadShizukuInventory(prefs)": "loadShizukuInventory(context)",
              "saveInventory(prefs,": "saveInventory(context,",
              "saveAlerts(prefs,": "saveAlerts(context,",
              "saveShizukuInventory(prefs,": "saveShizukuInventory(context,",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          old = 'val process = Shizuku.newProcess(arrayOf("sh", "-c", script), null, null)'
          new = 'val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", script))'
          if old not in s:
              raise SystemExit("Expected Shizuku API call not found; refusing to patch an unknown source version")
          s = s.replace(old, new)
          p.write_text(s)
          print("Patched Context arguments and disabled unsupported Shizuku process execution; SAF scanner remains available.")
          PY

      - name: Align Java and Kotlin JVM targets
        run: |
          find PojavGuard-Standalone/android -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | xargs -0 -r sed -i 's/JavaVersion\\.VERSION_1_8/JavaVersion.VERSION_17/g; s/jvmTarget = "1.8"/jvmTarget = "17"/g; s/jvmTarget = '\''1.8'\''/jvmTarget = '\''17'\''/g'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -Pkotlin.jvm.target.validation.mode=warning -p PojavGuard-Standalone/android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavGuard-debug-apk
          path: PojavGuard-Standalone/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
